<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script src="/creativity-hub/theme.js"></script>
  <title>Atelier</title>
  <link rel="stylesheet" href="/creativity-hub/app.css">
  <script type="module" src="/creativity-hub/app.js"></script>
</head>
<body>
  <div class="win">
    <nav class="side" aria-label="Bereiche">
      <label class="find">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Suchen" aria-label="Suchen" autocomplete="off">
        <kbd>⌘K</kbd>
      </label>
      <a class="navi" href="#/sammlung" data-route="sammlung">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span class="t">Sammlung</span><span class="n" id="count-clips"></span>
      </a>
      <div id="plugin-pages"></div>
      <div class="sect">Projekte
        <button type="button" id="new-project" aria-label="Neues Projekt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </div>
      <div id="projects" class="projects"></div>
      <div class="sect" id="saved-title" hidden>Sammlungen</div>
      <div id="saved" class="projects"></div>
      <div class="foot">
        <a class="navi" href="#/sortieren" data-route="sortieren">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span class="t">Sortieren</span>
        </a>
        <a class="navi" href="#/tags" data-route="tags">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.59 2.59A2 2 0 0 0 11.17 2H4a2 2 0 0 0-2 2v7.17a2 2 0 0 0 .59 1.42l8.7 8.7a2.43 2.43 0 0 0 3.42 0l6.58-6.58a2.43 2.43 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r="1"/></svg>
          <span class="t">Tags</span>
        </a>
        <a class="navi" id="instance-switch" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h17l-4-4m5 14H4l4 4"/></svg>
          <span class="t"></span>
        </a>
        <button class="navi" id="theme-switch" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
          <span class="t">Dunkel</span>
        </button>
        <a class="navi" href="#/anbieter" data-route="anbieter">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="t">Anbieter</span>
        </a>
      </div>
    </nav>
    <main id="view" tabindex="-1"></main>
    <aside id="inspector" class="inspector" aria-label="Details" hidden></aside>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
