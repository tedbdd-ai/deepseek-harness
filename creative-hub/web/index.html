<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creativity Hub</title>
  <link rel="stylesheet" href="/creativity-hub/app.css">
  <script type="module" src="/creativity-hub/app.js"></script>
</head>
<body>
  <aside>
    <a href="/creativity-hub" class="brand">Creativity Hub</a>
    <nav aria-label="Sammlungen">
      <button data-view="clips" aria-pressed="true">Clips</button>
      <button data-view="generation" aria-pressed="false">Generation Library</button>
    </nav>
    <div class="section"><h2>Projekte</h2><button id="new-project" aria-label="Projekt anlegen">+</button></div>
    <nav id="projects" aria-label="Projekte"></nav>
    <a class="back" href="/">DeepSeek Harness ↗</a>
  </aside>
  <main>
    <header><h1 id="view-title">Clips</h1><button class="primary" id="new-asset">Clip hinzufügen</button></header>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="project-detail" hidden>
      <form id="notes-form">
        <label for="notes">Projektnotizen</label>
        <textarea id="notes" rows="4" maxlength="24000"></textarea>
        <button>Notiz speichern</button>
      </form>
      <section class="board">
        <div class="section"><h2>Storyboard</h2><button id="open-board">Excalidraw öffnen</button></div>
        <div id="board-preview"></div>
        <div id="board-editor" hidden></div>
        <button id="save-board" hidden>Storyboard speichern</button>
      </section>
      <h2>Projekt-Assets</h2>
    </section>
    <label class="search"><span>Bibliothek durchsuchen</span><input id="search" type="search" placeholder="Titel, Quelle oder Beschreibung"></label>
    <section id="assets" class="grid" aria-label="Assets"></section>
  </main>
  <dialog id="asset-dialog">
    <form id="asset-form">
      <h2 id="asset-title">Clip hinzufügen</h2>
      <label>Titel<input name="title" required maxlength="200"></label>
      <label id="asset-source">Quell-URL<input name="source" type="url" maxlength="4096"></label>
      <label id="asset-preview">Bild-URL<input name="preview" type="url" maxlength="4096"></label>
      <label>Beschreibung<textarea name="description" rows="3" maxlength="4000"></textarea></label>
      <label id="asset-file" hidden>Datei<input name="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm"></label>
      <p class="form-status" role="alert"></p><footer><button type="button" data-close>Abbrechen</button><button class="primary">Speichern</button></footer>
    </form>
  </dialog>
  <dialog id="project-dialog">
    <form id="project-form">
      <h2>Projekt anlegen</h2>
      <label>Name<input name="title" required maxlength="160"></label>
      <p class="form-status" role="alert"></p><footer><button type="button" data-close>Abbrechen</button><button class="primary">Anlegen</button></footer>
    </form>
  </dialog>
</body>
</html>
